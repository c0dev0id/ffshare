plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The released version, on its own line so github_build_release.sh can read it.
// CI overrides it per build with -PappVersionName; keep the two in sync if this moves.
def releaseVersionName = "2.0.0"

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.caydey.ffshare"
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName project.hasProperty('appVersionName') ? appVersionName : releaseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (project.hasProperty('FFSHARE_RELEASE_STORE_FILE')) {
                storeFile file(FFSHARE_RELEASE_STORE_FILE)
                storePassword FFSHARE_RELEASE_STORE_PASSWORD
                keyAlias FFSHARE_RELEASE_KEY_ALIAS
                keyPassword FFSHARE_RELEASE_KEY_PASSWORD
            }
        }
    }
    
    splits {
        // Configures multiple APKs based on ABI.
        abi {
          // Enables building multiple APKs per ABI.
          enable true

          // Resets the list of ABIs for Gradle to create APKs for to none.
          reset()

          //noinspection ChromeOsAbiSupport
          include "armeabi-v7a", "arm64-v8a"

          // Create apk with merged ABI libraries
          universalApk true
        }
    }

    buildTypes {
        release {
            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            minifyEnabled false
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'com.caydey.ffshare'
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation(files('libs/ffmpeg-kit-next-8.1.1.aar'))
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    implementation 'com.jakewharton.timber:timber:5.0.1'

    // ffmpeg runs in a service and reports state back through a flow
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}