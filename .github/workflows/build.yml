name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch ffmpeg-kit AAR
        uses: ./.github/actions/ffmpeg-kit-aar
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint
        run: ./gradlew lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch ffmpeg-kit AAR
        uses: ./.github/actions/ffmpeg-kit-aar
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch ffmpeg-kit AAR
        uses: ./.github/actions/ffmpeg-kit-aar
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APKs
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ./gradlew assembleRelease \
            -PappVersionName="dev-${SHORT_SHA}" \
            -PFFSHARE_RELEASE_STORE_FILE="${{ runner.temp }}/release.keystore" \
            -PFFSHARE_RELEASE_STORE_PASSWORD="${{ secrets.SIGNING_KEYSTORE_PASSWORD }}" \
            -PFFSHARE_RELEASE_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}" \
            -PFFSHARE_RELEASE_KEY_PASSWORD="${{ secrets.SIGNING_KEY_PASSWORD }}"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

  draft-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download signed APKs
        uses: actions/download-artifact@v4.1.3
        with:
          name: app-release

      - name: Rename APKs
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          for apk in *.apk; do
            suffix="${apk#app-}"
            suffix="${suffix%-release.apk}"
            mv "$apk" "ffshare-dev-${SHORT_SHA}-${suffix}.apk"
          done

      - name: Delete existing dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete dev --yes 2>/dev/null || true

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          body: |
            Automated development build from commit ${{ github.sha }} on ${{ github.ref_name }}.

            This is a pre-release snapshot — not intended for production use.
          draft: false
          prerelease: true
          make_latest: false
          files: ffshare-dev-*.apk
